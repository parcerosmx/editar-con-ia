<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<style>
:root{--bg:#f7f5f2;--panel:#fff;--linea:#e2ddd6;--fg:#1f1c19;--suave:#6b645d;--acento:#c2410c;
  --ok:#2f7d3a;--cambiar:#b7791f;--quitar:#b42318;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--panel:#1e1b18;--linea:#2e2a26;--fg:#f3efe9;--suave:#a39b92;
  --acento:#fb923c;--ok:#6cc278;--cambiar:#e8b84a;--quitar:#f2777a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(24px,6vw,34px);line-height:1.15;margin:0}
.intro,.ayuda{color:var(--suave);margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;border:1px solid var(--linea);border-radius:99px;padding:2px 10px}
.caja{border:1px solid var(--cambiar);border-radius:12px;padding:12px 14px;background:var(--panel)}
.caja h2{font-size:16px;margin:0 0 6px}.caja ul{margin:0;padding-left:18px}
.tarjeta{border:1px solid var(--linea);border-radius:14px;background:var(--panel);overflow:hidden}
.cab{display:flex;gap:10px;align-items:baseline;padding:12px 14px 6px}
.n{font-size:24px;font-weight:700;color:var(--acento)}.cab h3{margin:0;font-size:16px;flex:1}
.t{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
video{display:block;width:100%;max-height:70vh;background:#000;aspect-ratio:9/16;object-fit:contain}
.cuerpo{padding:10px 14px 14px;display:grid;gap:10px}
.votos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.votos button{min-height:46px;border:1.5px solid var(--linea);border-radius:10px;background:transparent;color:var(--fg);font:600 15px var(--sans);cursor:pointer}
.votos button[aria-pressed=true].keep{background:var(--ok);border-color:var(--ok);color:#fff}
.votos button[aria-pressed=true].cambiar{background:var(--cambiar);border-color:var(--cambiar);color:#1a1206}
.votos button[aria-pressed=true].quitar{background:var(--quitar);border-color:var(--quitar);color:#fff}
textarea{width:100%;min-height:52px;border:1px solid var(--linea);border-radius:10px;padding:8px 10px;font:14px var(--sans);background:var(--bg);color:var(--fg)}
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:0 14px}
.op{position:relative;border:3px solid transparent;border-radius:12px;padding:0;background:#000;cursor:pointer;overflow:hidden;color:#fff;text-align:left}
.op video{aspect-ratio:9/16;object-fit:cover}
.op .num{position:absolute;top:6px;left:6px;background:var(--acento);color:#fff;font:700 20px/1 var(--sans);padding:4px 8px;border-radius:8px}
.op .desc{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.op[aria-pressed=true]{border-color:var(--ok)}
.op[aria-pressed=true]::after{content:"✓";position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;font:700 17px/28px var(--sans);text-align:center}
.pie{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;background:var(--panel);border-top:1px solid var(--linea);display:flex;gap:10px;align-items:center;justify-content:center}
.pie button{min-height:46px;padding:0 22px;border:0;border-radius:12px;background:var(--acento);color:#fff;font:600 15px var(--sans);cursor:pointer}
.pie .msg{font-size:13px;color:var(--suave)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header><p class="ayuda" id="eyebrow"></p><h1 id="titulo"></h1><p class="intro" id="intro"></p></header>
  <div class="chips" id="chips"></div>
  <div id="dudas"></div>
  <div id="lista" style="display:grid;gap:16px"></div>
</div>
<div class="pie"><span class="msg" id="msg"></span><button id="copiar" type="button">Copiar mis respuestas</button></div>
<script>
const D = /*DATOS*/null;
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fmt = (s) => { const m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(1).padStart(4, "0"); };
const CLAVE = "storyboard:" + D.titulo + ":r" + D.ronda;
let votos = {};
try { votos = JSON.parse(localStorage.getItem(CLAVE) || "{}"); } catch (e) { votos = {}; }
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(votos)); } catch (e) {} pintar(); };

$("eyebrow").textContent = (D.modo === "opciones" ? "Opciones de tomas" : "Revisión") + " · ronda " + D.ronda;
$("titulo").textContent = D.titulo;
$("intro").textContent = D.modo === "opciones"
  ? "Toca las tomas que te gustan de cada idea. Si ninguna sirve, escríbelo abajo."
  : "Cada tramo es un pedazo del video, con sonido. Marca Se queda, Cambiar o Quitar. Escribe sólo si hace falta.";
for (const c of D.chips || []) $("chips").append(el("span", "chip", c));
if (D.dudas && D.dudas.length) {
  const c = el("section", "caja"); c.append(el("h2", null, "Dudas que necesito que revises"));
  const ul = el("ul"); for (const d of D.dudas) ul.append(el("li", null, d)); c.append(ul); $("dudas").append(c);
}
function nota(id, ph) {
  const ta = el("textarea"); ta.placeholder = ph; ta.value = (votos[id] || {}).nota || "";
  ta.oninput = () => { votos[id] = { ...(votos[id] || {}), nota: ta.value.trim() }; guardar(); };
  return ta;
}
function tramo(t) {
  const c = el("article", "tarjeta"); c.id = t.id;
  const cab = el("div", "cab"); cab.append(el("span", "n", t.n), el("h3", null, "Tramo " + t.n), el("span", "t", fmt(t.desde) + "–" + fmt(t.hasta)));
  const v = el("video"); v.src = t.clip; v.poster = t.poster; v.controls = true; v.playsInline = true; v.preload = "none";
  const cu = el("div", "cuerpo"), vs = el("div", "votos");
  for (const [k, txt] of [["keep", "Se queda"], ["cambiar", "Cambiar"], ["quitar", "Quitar"]]) {
    const b = el("button", k, txt); b.type = "button"; b.dataset.v = k;
    b.onclick = () => { const a = votos[t.id] || {}; votos[t.id] = { ...a, voto: a.voto === k ? null : k }; guardar(); };
    vs.append(b);
  }
  cu.append(vs, nota(t.id, "Qué cambiar (opcional)")); c.append(cab, v, cu); return c;
}
const vista = "IntersectionObserver" in window ? new IntersectionObserver((es) => {
  for (const e of es) { if (e.isIntersecting) e.target.play().catch(() => {}); else e.target.pause(); } }, { threshold: .6 }) : null;
function idea(i) {
  const c = el("article", "tarjeta"); c.id = i.id;
  const cab = el("div", "cab"); cab.append(el("h3", null, i.titulo), el("span", "t", i.ops.length + " opciones"));
  const g = el("div", "ops");
  for (const o of i.ops) {
    const b = el("button", "op"); b.type = "button"; b.dataset.n = o.n;
    const v = el("video"); v.src = o.clip; v.poster = o.poster; v.muted = true; v.loop = true; v.playsInline = true; v.preload = "none";
    if (vista) vista.observe(v);
    b.append(v, el("span", "num", o.n), el("span", "desc", o.desc));
    b.onclick = () => { const a = votos[i.id] || {}; const s = new Set(a.elegidas || []); s.has(o.n) ? s.delete(o.n) : s.add(o.n);
      votos[i.id] = { ...a, elegidas: [...s].sort((x, y) => x - y) }; guardar(); };
    g.append(b);
  }
  const cu = el("div", "cuerpo"); cu.append(nota(i.id, "Falta algo o ninguna sirve (opcional)")); c.append(cab, g, cu); return c;
}
const items = D.modo === "opciones" ? D.ideas : D.tramos;
function pintar() {
  let hechos = 0;
  for (const it of items) {
    const v = votos[it.id] || {}, c = $(it.id);
    if (D.modo === "opciones") { const s = new Set(v.elegidas || []);
      for (const b of c.querySelectorAll(".op")) b.setAttribute("aria-pressed", String(s.has(+b.dataset.n)));
      if (s.size || v.nota) hechos++;
    } else { for (const b of c.querySelectorAll(".votos button")) b.setAttribute("aria-pressed", String(v.voto === b.dataset.v));
      if (v.voto) hechos++; }
  }
  $("msg").textContent = hechos + " de " + items.length + " revisados";
}
function texto() {
  const L = ["Mis respuestas · " + D.titulo + " · ronda " + D.ronda];
  for (const it of items) {
    const v = votos[it.id] || {};
    if (D.modo === "opciones") {
      L.push("- " + it.titulo + ": " + ((v.elegidas || []).length ? "me gustan " + v.elegidas.join(", ") : "ninguna elegida") + (v.nota ? " · nota: " + v.nota : ""));
    } else {
      const n = { keep: "se queda", cambiar: "CAMBIAR", quitar: "QUITAR" }[v.voto] || "sin marcar";
      L.push("- tramo " + it.n + " (" + fmt(it.desde) + "–" + fmt(it.hasta) + "): " + n + (v.nota ? " · nota: " + v.nota : ""));
    }
  }
  return L.join("\n");
}
for (const it of items) $("lista").append(D.modo === "opciones" ? idea(it) : tramo(it));
pintar();
$("copiar").onclick = async () => {
  const t = texto();
  try { await navigator.clipboard.writeText(t); $("msg").textContent = "Copiado. Pégalo en el chat con Claude."; }
  catch (e) { const ta = el("textarea"); ta.value = t; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
    $("msg").textContent = "Copiado. Pégalo en el chat con Claude."; }
};
</script>
</body>
</html>
